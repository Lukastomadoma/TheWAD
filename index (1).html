function renderMap(){markers.clearLayers();routes.clearLayers();filtered().forEach(p=>{let m=window.L.circleMarker([p.lat,p.lng],{radius:p.precision==="exact"?7:6,color:"#0b0d0c",weight:2,fillColor:COLORS[p.series],fillOpacity:.92,dashArray:p.precision==="exact"?null:"3 3"}).addTo(markers);m.bindTooltip(p.name);m.on("click",()=>showPlace(p));});
if(selectedRoute) drawRoute(selectedRoute,false);}
function showPlace(p){document.querySelector("#detailBody").innerHTML=`<small>${N[p.series]} • ${p.region}</small><h2>${p.name}</h2><span class="badge">${p.precision==="exact"?"● potvrzená oblast":"◐ přibližná kanonická oblast"}</span><p>${p.desc}</p><div class="people"><b>Postavy:</b> ${p.people||"—"}<br><b>Frakce:</b> ${p.factions||"—"}</div>`;document.querySelector("#detail").classList.add("show")}
function showChar(name){let [s,role,path,rels,bio]=C[name];document.querySelector("#detailBody").innerHTML=`<small>${N[s]||s}</small><h2>${name}</h2><span class="badge">${role}</span><p>${bio}</p><div class="people"><b>Klíčové vztahy:</b> ${rels}</div><button class="routeBtn" onclick='drawRoute(${JSON.stringify(name)},true)'>Zobrazit cestu na mapě</button>`;document.querySelector("#detail").classList.add("show")}
function drawRoute(name,fit){selectedRoute=name;routes.clearLayers();let rec=C[name];if(!rec)return;let pts=rec[2].split(",").map(id=>L.find(p=>p.id===id)).filter(Boolean).filter(p=>!p.spoiler||document.querySelector("#spoiler").checked);let line=window.L.polyline(pts.map(p=>[p.lat,p.lng]),{color:"#e5e8e5",weight:4,opacity:.8,dashArray:"9 7"}).addTo(routes);pts.forEach((p,i)=>window.L.circleMarker([p.lat,p.lng],{radius:3,color:"#fff",fillOpacity:1}).bindTooltip((i+1)+". "+p.name).addTo(routes));if(fit&&pts.length)mp.fitBounds(line.getBounds(),{padding:[35,35]})}
function showFaction(name){let [s,ids,bio]=F[name];let pts=ids.split(",").map(id=>L.find(p=>p.id===id)).filter(Boolean);document.querySelector("#detailBody").innerHTML=`<small>${N[s]||s}</small><h2>${name}</h2><p>${bio}</p><div class="people"><b>Známé body:</b> ${pts.map(p=>p.name).join(" • ")}</div>`;document.querySelector("#detail").classList.add("show");routes.clearLayers();pts.forEach(p=>window.L.circleMarker([p.lat,p.lng],{radius:13,color:"#fff",weight:2,fillOpacity:.1}).addTo(routes));if(pts.length)mp.fitBounds(window.L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[60,60]})}
function closeDetail(){document.querySelector("#detail").classList.remove("show")}
function renderList(){let el=document.querySelector("#list"),q=document.querySelector("#q").value.toLowerCase();el.innerHTML="";
if(tab==="places"){document.querySelector("#listTitle").textContent="Lokace";filtered().slice(0,80).forEach(p=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<b><span class="sw" style="background:${COLORS[p.series]}"></span>${p.name}</b><small>${p.region} • ${p.precision==="exact"?"potvrzená":"přibližná"}</small>`;d.onclick=()=>{mp.flyTo([p.lat,p.lng],Math.max(mp.getZoom(),7));showPlace(p)};el.appendChild(d)})}
else if(tab==="chars"){document.querySelector("#listTitle").textContent="Postavy";Object.keys(C).filter(n=>!q||n.toLowerCase().includes(q)||C[n].join(" ").toLowerCase().includes(q)).forEach(n=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${n}</b><small>${C[n][1]}</small>`;d.onclick=()=>showChar(n);el.appendChild(d)})}
else{document.querySelector("#listTitle").textContent="Frakce & komunity";Object.keys(F).filter(n=>!q||n.toLowerCase().includes(q)||F[n].join(" ").toLowerCase().includes(q)).forEach(n=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${n}</b><small>${N[F[n][0]]||F[n][0]}</small>`;d.onclick=()=>showFaction(n);el.appendChild(d)})}}
const sf=document.querySelector("#series");Object.keys(N).forEach(k=>{let l=document.createElement("label");l.innerHTML=`<input type="checkbox" checked data-s="${k}"> <span class="sw" style="background:${COLORS[k]}"></span>${N[k]}`;sf.appendChild(l)});sf.onchange=e=>{let k=e.target.dataset.s;if(k){e.target.checked?active.add(k):active.delete(k);renderMap();renderList()}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;renderList()});
["spoiler","approx"].forEach(id=>document.querySelector("#"+id).onchange=()=>{renderMap();renderList()});
document.querySelector("#q").oninput=()=>{renderMap();renderList()};
document.querySelector("#era").oninput=e=>{era=+e.target.value;document.querySelector("#eraTxt").textContent=era==14?"CELÁ ČASOVÁ OSA":"ETAPA "+era+" — připraveno pro časová data"};
renderMap();renderList();mp.fitBounds([[27,-123],[51,7]]);
</script></body></html>
